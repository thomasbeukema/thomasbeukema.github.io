{{ define "main" }}
  <article class="article">
    <p class="article-back">
      <a href="{{ "blog" | relLangURL }}">{{ i18n "backToBlog" }}</a>
    </p>
    <header class="article-header">
      {{ with .Params.subject }}
        <p class="page-kicker">{{ . }}</p>
      {{ end }}

      <h1 class="article-title">{{ .Title }}</h1>
      {{ with .Params.summary }}<p class="article-dek">{{ . }}</p>{{ end }}
      <p class="article-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>
        <span class="sep">·</span>
        <span>{{ i18n "minRead" (dict "Count" .ReadingTime) }}</span>
      </p>
      <div class="page-rule" aria-hidden="true"></div>
    </header>
    <div class="article-body">
      {{ .Content }}
    </div>
  </article>
{{ end }}
