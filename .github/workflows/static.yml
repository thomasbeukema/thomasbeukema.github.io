name: Deploy Hugo site to Pages

env:
  HUGO_VERSION: 0.168.0
  TZ: Europe/Amsterdam

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          set -euo pipefail
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          for attempt in 1 2 3 4 5; do
            echo "Downloading Hugo v${HUGO_VERSION} (attempt ${attempt}/5)..."
            if curl --fail --silent --show-error --location \
                --retry 3 --retry-delay 5 --retry-all-errors \
                -o /tmp/hugo.tar.gz "$url" \
              && gzip -t /tmp/hugo.tar.gz; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Failed to download a valid Hugo archive after ${attempt} attempts" >&2
              file /tmp/hugo.tar.gz || true
              head -c 200 /tmp/hugo.tar.gz || true
              exit 1
            fi
            sleep $((attempt * 5))
          done
          sudo tar -C /usr/local/bin -xzf /tmp/hugo.tar.gz hugo
          hugo version

      - name: Build
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
